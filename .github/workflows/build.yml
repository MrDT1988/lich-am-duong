name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: mkdir code && unzip -q src.zip -d code
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - run: gradle assembleRelease --no-daemon --stacktrace
        working-directory: code
      - run: cp code/app/build/outputs/apk/release/app-release.apk LichAmDuong.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Lịch Âm Dương v${{ github.run_number }}
          files: LichAmDuong.apk
          make_latest: true
